<!doctype html>
<html lang="ru"><head>
<script src="https://telegram.org/js/telegram-web-app.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"><title>Eggs Bablooh</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at top,#75427b,#24142d 72%);font-family:'Nunito',sans-serif;color:#fff}
main{width:min(100%,480px);text-align:center}.logo{font-family:'Fredoka',sans-serif;font-size:clamp(24px,6vw,34px);font-weight:700;letter-spacing:1px;color:#ffe0f6;text-shadow:0 3px 15px #ff54c8;margin:0}.tag{font-size:12px;opacity:.8;margin:3px 0 12px}
.game{position:relative;border:3px solid #f8b8e7;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #0008;background:#f8c5e8}
canvas{width:100%;height:auto;display:block;touch-action:none}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;font-size:15px;text-shadow:0 2px 5px #5b285b;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#32133466;backdrop-filter:blur(3px)}
.panel{max-width:310px;background:#fff0f9ee;color:#54244e;border:2px solid #fff;border-radius:22px;padding:22px;box-shadow:0 10px 35px #4d1b4c66}
.panel h2{margin:0 0 8px;font-size:25px}.panel p{font-size:14px;line-height:1.45;margin:5px 0 16px}
button{border:0;border-radius:999px;background:linear-gradient(135deg,#ff55b9,#a94de0);color:white;font-size:16px;font-weight:900;padding:13px 27px;box-shadow:0 5px 0 #82368f;cursor:pointer}
.controls{display:flex;gap:12px;margin-top:12px}.controls button{flex:1;padding:14px 8px;font-size:19px;touch-action:none;user-select:none}
.hint{font-size:12px;opacity:.75;margin-top:10px}
.loss-image{display:none;width:148px;height:148px;object-fit:cover;object-position:center 88%;border-radius:28px;margin:0 auto 12px;background:#1a0f20;filter:drop-shadow(0 8px 16px #0004)}.panel h2,.panel p{clear:both}</style></head><body><main>
<h1 class="logo">EGGS BABLOOH</h1><div class="tag">ПОЙМАЙ КАК МОЖНО БОЛЬШЕ ЯИЦ 🥚</div>
<div class="game"><canvas id="c" width="440" height="650"></canvas>
<div class="hud"><span id="score">🥚 0</span><span id="miss">❌ 0 / 5</span><span id="best">РЕКОРД: 0</span></div>
<div class="overlay" id="overlay"><div class="panel"><img class="loss-image" src="game-over.webp" alt="Баблух проиграл"><h2 id="title">Ловим яйца!</h2><p id="desc">Управляй своим персонажем и лови падающие яйца в корзину. Не дай пяти яйцам разбиться!</p><button id="start">Играть</button></div></div>
</div>
<div class="controls"><button id="left" aria-label="Влево">◀</button><button id="right" aria-label="Вправо">▶</button></div>
<div class="hint">Управление: ← → / A D / кнопки снизу / веди пальцем по экрану</div>
</main>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=440,H=650;
const img=new Image();img.src='eggs-hero.webp';

function tgHaptic(kind){
  try{
    const h=window.Telegram?.WebApp?.HapticFeedback;
    if(!h)return;
    if(kind==='light')h.impactOccurred('light');
    else if(kind==='medium')h.impactOccurred('medium');
    else if(kind==='heavy')h.impactOccurred('heavy');
    else if(kind==='soft')h.impactOccurred('soft');
    else if(kind==='success')h.notificationOccurred('success');
    else if(kind==='error')h.notificationOccurred('error');
  }catch(e){}
}
const $=id=>document.getElementById(id);
let state='ready',score=0,missed=0,best=+(localStorage.getItem('babloohEggBest')||0),playerX=220,eggs=[],tick=0,last=0,move=0;
$('best').textContent='РЕКОРД: '+best;
const nests=[55,165,275,385];
function rounded(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke()}}
function draw(){
 const palettes=[['#f2b5e2','#ffe6f4'],['#ef9e9e','#f8d2b0'],['#8c9bd5','#d7c7ed'],['#27365f','#6a568d']];
 const phase=Math.min(score/20,palettes.length-1),idx=Math.min(Math.floor(phase),palettes.length-2),t=phase-idx;
 const mix=(a,b,t)=>{const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),r=Math.round(((A>>16)&255)+(((B>>16)&255)-((A>>16)&255))*t),gg=Math.round(((A>>8)&255)+(((B>>8)&255)-((A>>8)&255))*t),bb=Math.round((A&255)+((B&255)-(A&255))*t);return `rgb(${r},${gg},${bb})`};
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,mix(palettes[idx][0],palettes[idx+1][0],t));bg.addColorStop(1,mix(palettes[idx][1],palettes[idx+1][1],t));g.fillStyle=bg;g.fillRect(0,0,W,H);
 // soft decorative room
 g.fillStyle='#ffffff35';for(let i=0;i<8;i++){g.beginPath();g.arc((i*73+25)%W,100+(i%3)*105,25+(i%2)*9,0,7);g.fill()}
 // nests and hanging branches
 nests.forEach((x,i)=>{g.strokeStyle='#8e5a49';g.lineWidth=8;g.beginPath();g.moveTo(x,0);g.lineTo(x,54);g.stroke();g.fillStyle='#7d4a42';g.beginPath();g.ellipse(x,61,29,12,0,0,7);g.fill();g.fillStyle='#b67a58';g.beginPath();g.ellipse(x,57,24,8,0,0,7);g.fill()});
 // eggs
 eggs.forEach(e=>{g.save();g.translate(e.x,e.y);g.rotate(Math.sin(e.y*.03)*.08);if(e.type==='poop'){g.fillStyle='#6b3d25';g.strokeStyle='#3c241a';g.lineWidth=2;g.beginPath();g.moveTo(-13,10);g.bezierCurveTo(-23,2,-13,-8,-6,-6);g.bezierCurveTo(-13,-20,8,-20,7,-7);g.bezierCurveTo(20,-5,19,8,12,11);g.closePath();g.fill();g.stroke();g.fillStyle='#f3d3a2';g.beginPath();g.arc(-4,1,2,0,7);g.arc(5,1,2,0,7);g.fill()}else{g.fillStyle='#fffdf4';g.strokeStyle='#d7a9b8';g.lineWidth=2;g.beginPath();g.ellipse(0,0,12,16,0,0,7);g.fill();g.stroke();g.fillStyle='#f5c9df';g.beginPath();g.ellipse(-3,-5,3,4,0,0,7);g.fill()}g.restore()});
 // floor
 g.fillStyle='#d78abf';g.fillRect(0,570,W,80);g.fillStyle='#f7c5e7';for(let x=0;x<W;x+=44)g.fillRect(x,582,23,7);
 // player cutout sized down, with basket in front
 const pw=92,ph=180,py=390;
 if(img.complete&&img.naturalWidth)g.drawImage(img,playerX-pw/2,py,pw,ph);
 else {g.fillStyle='#57314f';g.beginPath();g.arc(playerX,465,35,0,7);g.fill()}
 // basket held in front
 rounded(playerX-43,540,86,31,8,'#b87942','#75442f');
 g.strokeStyle='#75442f';g.lineWidth=5;g.beginPath();g.arc(playerX,545,34,Math.PI,0);g.stroke();
 g.fillStyle='#f3d19a';for(let x=playerX-30;x<playerX+35;x+=15)g.fillRect(x,545,5,23);
}
function hud(){$('score').textContent='🥚 '+score;$('miss').textContent='❌ '+missed+' / 5'}
function spawn(){const lane=Math.floor(Math.random()*4),type=Math.random()<.2?'poop':'egg';eggs.push({type,x:nests[lane]+(Math.random()*12-6),y:76,v:2.2+Math.min(score*.045,3.4)+(type==='poop'?.25:0),lane})}
function reset(){score=0;missed=0;playerX=220;eggs=[];tick=0;move=0;spawn();hud()}
function start(){tgHaptic('soft');reset();state='playing';$('overlay').querySelector('.loss-image').style.display='none';$('overlay').style.display='none';last=performance.now();requestAnimationFrame(loop)}
function finish(){if(state==='over')return;tgHaptic('error');submitBabloohScore('eggs', score);state='over';if(score>best){best=score;localStorage.setItem('babloohEggBest',best);$('best').textContent='РЕКОРД: '+best}$('title').textContent='Игра окончена!';$('desc').textContent='Ты поймал '+score+' яиц. Иди работай жирный! Или попробуешь улучшить результат?';$('start').textContent='Ещё раз';$('overlay').querySelector('.loss-image').style.display='block';$('overlay').style.display='flex'}
function loop(t){if(state!=='playing')return;const dt=Math.min((t-last)/16.67,2);last=t;tick+=dt;
 playerX+=move*5.2*dt;playerX=Math.max(53,Math.min(W-53,playerX));
 if(tick>Math.max(28,76-score*1.3)){spawn();tick=0}
 eggs.forEach(e=>e.y+=e.v*dt);
 eggs=eggs.filter(e=>{if(e.y>532&&e.y<570&&Math.abs(e.x-playerX)<51){if(e.type==='poop'){finish();return false}score++;tgHaptic('light');hud();return false}if(e.y>575){if(e.type!=='poop'){missed++;hud();if(missed>=5)finish()}return false}return true});
 draw();if(state==='playing')requestAnimationFrame(loop)}
function setMove(v){move=v}
$('start').addEventListener('click',start);
$('left').addEventListener('pointerdown',e=>{e.preventDefault();setMove(-1)});$('right').addEventListener('pointerdown',e=>{e.preventDefault();setMove(1)});
['left','right'].forEach(id=>{const b=$(id);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>setMove(0)))});
window.addEventListener('keydown',e=>{if(['ArrowLeft','KeyA'].includes(e.code)){e.preventDefault();setMove(-1)}if(['ArrowRight','KeyD'].includes(e.code)){e.preventDefault();setMove(1)}if(e.code==='Space'&&state!=='playing')start()});
window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))setMove(0)});
c.addEventListener('pointerdown',e=>{if(state!=='playing')return;const r=c.getBoundingClientRect();playerX=((e.clientX-r.left)/r.width)*W});
c.addEventListener('pointermove',e=>{if(state!=='playing'||e.buttons===0)return;const r=c.getBoundingClientRect();playerX=((e.clientX-r.left)/r.width)*W});
draw();

// BABLOOH GAMES: отправка рекордов в глобальный рейтинг
const BABLOOH_SUPABASE_URL = 'https://pxjuqmjtlbfhfsullwdu.supabase.co';
const BABLOOH_SUPABASE_KEY = 'sb_publishable_rlLNGhYLo8CRwXpaHh5kEw_ozuW1_D0';
async function submitBabloohScore(gameId, score) {
  try {
    const initData = window.Telegram?.WebApp?.initData || '';
    if (!initData) { console.warn('Telegram initData отсутствует: результат не отправлен'); return; }
    const response = await fetch(`${BABLOOH_SUPABASE_URL}/functions/v1/submit-score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': BABLOOH_SUPABASE_KEY },
      body: JSON.stringify({ initData, gameId, score: Math.max(0, Math.floor(score)) })
    });
    const responseText = await response.text();
    if (!response.ok) { console.error('BABLOOH score submit failed:', gameId, response.status, responseText); return false; }
    console.info('BABLOOH score accepted:', gameId, Math.max(0, Math.floor(score)), responseText);
    return true;
  } catch (error) { console.error('BABLOOH score submit error:', gameId, error); return false; }
}
</script></body></html>
